name: Deadline reminders

# Runs entirely on GitHub's runners so reminders keep firing even when Brian's own machine is
# off - the whole point of moving the DB to Supabase (see project memory). Every ~15 minutes is
# fine granularity against the T-24h/T-3h/T-30m tiers in src/notify/deadline_scheduler.py; the
# script itself is idempotent (reminder_log table), so overlapping/frequent runs are safe.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately not the full requirements.txt (matplotlib/sklearn/xgboost/streamlit/
      # statsmodels aren't needed here and would slow every 15-minute run down for nothing) -
      # just what src/notify/deadline_scheduler.py, src/notify/approval_bot.py,
      # src/fpl_write/client.py, and src/recommendations imports actually touch. `requests` is
      # approval_bot's transitive dependency via client.py, now that the scheduler actually
      # calls into the FPL write path instead of only reading the DB.
      - name: Install dependencies
        run: pip install pandas psycopg2-binary sqlalchemy python-telegram-bot python-dotenv requests

      - name: Run deadline scheduler
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          FPL_SEASON: "2026-27"
          FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FPL_SESSION_COOKIE: ${{ secrets.FPL_SESSION_COOKIE }}
          FPL_API_AUTHORIZATION: ${{ secrets.FPL_API_AUTHORIZATION }}
        run: python -m src.notify.deadline_scheduler
