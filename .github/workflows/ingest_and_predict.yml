name: Ingest data and refresh predictions

# Runs entirely on GitHub's runners, same as deadline_reminders.yml - the app-level data refresh
# (src/ingestion/load.py, src/ingestion/load_manager.py, src/models/predict_live.py) was
# previously a manual step and silently stopped happening, leaving the DB (and everything
# downstream: dashboard, deadline reminders) stuck on GW1 data for a week. This closes that gap.
#
# Every run is idempotent (upserts keyed on season/event_id/player_code etc.), so overlapping or
# frequent runs are safe - this is what lets the two schedules below safely overlap rather than
# needing to be mutually exclusive.
#
# Two-tier cadence instead of one flat interval, since bonus points/provisional live stats only
# actually move while a match is being played: PL fixtures run Friday evening through Monday
# night (UTC) - every 15 minutes in that window (matching deadline_reminders.yml's own cadence)
# keeps live gameweeks fresh without the lag that a flat interval would need to also cover
# off-peak hours. Every 3 hours the rest of the week, when nothing's actually changing, so
# FPL's free public API isn't hit for no reason. Day-of-week ranges can't cross a week boundary
# in one cron expression, so the matchday window is spelled out as four lines (cron fields are
# UTC-only; GitHub Actions doesn't support a CRON_TZ-style timezone prefix here):
#   Fri 18:00-23:59, all Saturday, all Sunday, Mon 00:00-21:59.
on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "*/15 18-23 * * 5"
    - cron: "*/15 * * * 6"
    - cron: "*/15 * * * 0"
    - cron: "*/15 0-21 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Minimal install for load.py/load_manager.py/predict_live.py's actual import graph -
      # matplotlib/streamlit/ipykernel/nbclient/nbformat/statsmodels/pulp/python-telegram-bot/
      # rapidfuzz/beautifulsoup4 aren't touched by this path. scikit-learn/xgboost are needed
      # even though predict_live.py doesn't import them directly - joblib.load needs the model
      # classes' defining modules importable to unpickle the saved artifacts.
      - name: Install dependencies
        run: pip install requests psycopg2-binary "psycopg[binary]>=3.1" sqlalchemy python-dotenv pandas numpy scikit-learn xgboost joblib

      - name: Pull bootstrap/fixtures/live gameweek stats
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          FPL_SEASON: "2026-27"
        run: python -m src.ingestion.load

      - name: Pull manager history and squad picks
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          FPL_SEASON: "2026-27"
          FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
        run: python -m src.ingestion.load_manager

      - name: Refresh live predictions
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          FPL_SEASON: "2026-27"
        run: python -m src.models.predict_live
