[theme]
base = "dark"

# Team Talk palette - the studio around a magnetic tactics board: near-black ground, board
# green panels, chalk-white text, the magnets' red, and the gaffer's yellow marker.
# dashboard/app.py's tokens and dashboard/team_talk.py use the same values - keep them in sync.
primaryColor = "#D7263D"
backgroundColor = "#0B0F0D"
secondaryBackgroundColor = "#111A15"
textColor = "#F2F5F0"
borderColor = "#24352B"
# Links in the marker yellow: the red is a fill colour, not a text colour.
linkColor = "#FFE14D"
linkUnderline = false

# Semantic colors (deltas, badges, status)
greenColor = "#7BE495"
redColor = "#D7263D"
blueColor = "#5B9BF5"
orangeColor = "#FFE14D"
violetColor = "#C084FC"
grayColor = "#A9B8AE"

# Chart palette - the marker yellow first (the model's own numbers), then the magnets' red
chartCategoricalColors = ["#FFE14D", "#D7263D", "#7BE495", "#5B9BF5", "#C084FC", "#22D3EE", "#A9B8AE"]
chartSequentialColors = ["#111A15", "#14402A", "#1D5A3A", "#2E7449", "#4E8F4F", "#7AA94F", "#A7C04D", "#D2D24C", "#F0DC4C", "#FFE14D"]

# Dataframe styling
dataframeBorderColor = "#24352B"
dataframeHeaderBackgroundColor = "#111A15"

# Typography - the Team Talk pair: Barlow for text, Big Shoulders Display (stadium-scoreboard
# condensed caps) for headings. Replaced Space Grotesk, one of the stock AI-dashboard faces.
font = "Barlow:https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
headingFont = "'Big Shoulders Display':https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["38px", "30px", "24px", "20px", "16px", "14px"]
headingFontWeights = [900, 800, 800, 800, 700, 700]

# Shape - the board's slightly rounded edges, not pills
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0B0F0D"
secondaryBackgroundColor = "#111A15"
textColor = "#F2F5F0"
borderColor = "#24352B"
primaryColor = "#D7263D"
